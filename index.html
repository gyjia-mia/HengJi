<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1c1b1f">
<title>恒迹 · 坚持打卡</title>
<style>
  :root{
    --bg: #f6f5f2;
    --card: #ffffff;
    --ink: #1c1b1f;
    --ink-2: #55525c;
    --ink-3: #8e8a95;
    --line: #e6e3dd;
    --accent: #2f6b4f;
    --accent-soft: #e8f1eb;
    --danger: #b3261e;
    --danger-soft: #fbeae9;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(28,27,31,.06), 0 8px 24px -16px rgba(28,27,31,.35);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg: #141316;
      --card: #1d1c21;
      --ink: #f2f0f4;
      --ink-2: #b9b5c0;
      --ink-3: #837f8c;
      --line: #302e36;
      --accent: #6ec09a;
      --accent-soft: #22322b;
      --danger: #f2837c;
      --danger-soft: #3a2321;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.9);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 48px;
  }
  button, input, textarea, select{font:inherit; color:inherit}
  button{cursor:pointer; border:none; background:none}

  .wrap{max-width: 1180px; margin: 0 auto; padding: 0 16px}

  /* ---------- 顶部 ---------- */
  header.top{
    position: sticky; top:0; z-index: 30;
    background: color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .top-in{
    display:flex; align-items:center; gap:12px;
    padding: 14px 0;
  }
  .brand{font-size: 17px; font-weight: 700; letter-spacing:.02em; margin-right:auto; display:flex; align-items:center; gap:8px; white-space: nowrap; flex-shrink: 0}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  .brand small{font-weight:500; color:var(--ink-3); font-size:12px; white-space: nowrap}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding: 8px 14px; border-radius: 999px;
    background: var(--card); color: var(--ink);
    border: 1px solid var(--line);
    font-size: 13.5px; font-weight: 600;
    transition: transform .12s ease, background .15s, border-color .15s;
    white-space: nowrap;
  }
  .btn:hover{border-color: var(--ink-3)}
  .btn:active{transform: scale(.97)}
  .btn-primary{background: var(--accent); color:#fff; border-color: var(--accent)}
  @media (prefers-color-scheme: dark){ .btn-primary{color:#0d1410} }
  .btn-primary:hover{border-color: var(--accent); filter: brightness(1.06)}
  .btn-ghost{background: transparent}
  .btn-danger{color: var(--danger); border-color: var(--line)}
  .btn-danger:hover{background: var(--danger-soft); border-color: var(--danger)}
  .btn-sm{padding: 5px 10px; font-size: 12.5px}

  /* ---------- 项目网格 ---------- */
  .grid{
    display: grid; gap: 16px;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    margin-top: 20px;
    align-items: start;
  }
  .card{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    display:grid;
    grid-template-rows: auto auto 1fr;
  }
  .card-head{
    padding: 16px 16px 12px;
    display:flex; flex-direction: column; gap: 10px;
  }
  .card-title-row{display:flex; align-items:flex-start; gap:8px}
  .card-title{
    font-size: 16px; font-weight: 700; line-height:1.35;
    margin-right:auto; word-break: break-word;
  }
  .mini-btn{
    height: 24px; padding: 0 8px;
    border-radius: 7px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--ink-3);
    font-size: 11.5px; font-weight: 600;
    display:inline-flex; align-items:center; justify-content:center;
    flex: 0 0 auto;
    transition: background .15s, color .15s, border-color .15s;
    white-space: nowrap;
  }
  .mini-btn:hover{background: var(--bg); color: var(--ink); border-color: var(--line)}
  .mini-btn.del:hover{background: var(--danger-soft); color: var(--danger); border-color: var(--danger)}

  .note{font-size: 12.5px; color: var(--ink-3); margin: -4px 0 0; word-break: break-word}

  /* 计数区 */
  .counter{
    display:flex; align-items:flex-end; gap: 10px;
    margin-top: 2px;
  }
  .counter .num{
    font-size: 40px; font-weight: 800; line-height: 1;
    letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
  }
  .counter .unit{font-size: 14px; color: var(--ink-2); font-weight:600; padding-bottom: 4px}
  .counter .sub{margin-left:auto; font-size: 12px; color: var(--ink-3); text-align:right; line-height:1.4}

  /* 进度条 */
  .progress{margin-top: 10px}
  .bar{height: 8px; border-radius: 999px; background: var(--bg); overflow:hidden; border:1px solid var(--line)}
  .bar > i{display:block; height:100%; background: var(--accent); border-radius:999px; transition: width .35s ease}
  .progress-meta{display:flex; justify-content:space-between; font-size:11.5px; color:var(--ink-3); margin-top:4px}

  /* 打卡按钮 */
  .punch-bar{
    display: flex; gap: 8px;
    margin: 4px 16px 0;
  }
  .punch{
    flex: 1 1 auto;
    padding: 14px;
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    font-size: 16px; font-weight: 700;
    letter-spacing: .02em;
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition: transform .1s ease, filter .15s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  @media (prefers-color-scheme: dark){ .punch{color:#0d1410} }
  .punch:hover{filter: brightness(1.06)}
  .punch:active{transform: scale(.975)}
  .punch .plus{font-size: 18px; font-weight: 800}

  .punch-custom{
    flex: 0 0 auto;
    padding: 14px 14px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink-2);
    font-size: 13.5px; font-weight: 700;
    white-space: nowrap;
    transition: background .15s, border-color .15s, color .15s, transform .1s;
    -webkit-tap-highlight-color: transparent;
  }
  .punch-custom:hover{border-color: var(--accent); color: var(--accent); background: var(--accent-soft)}
  .punch-custom:active{transform: scale(.97)}

  /* 记录区 */
  .log{
    margin: 14px 0 0;
    border-top: 1px solid var(--line);
    display:flex; flex-direction: column;
    min-height: 0;               /* 关键：允许在 grid 行内收缩 */
    overflow: hidden;
  }
  .log-head{
    display:flex; align-items:center; gap:8px;
    padding: 10px 16px 6px;
    font-size: 12px; color: var(--ink-3); font-weight: 600;
    letter-spacing: .04em;
  }
  .log-head .spacer{margin-left:auto}
  .log-list{
    max-height: 320px; overflow-y: auto;
    padding: 0 8px 10px;
    overscroll-behavior: contain;
    flex: 0 1 auto;
  }
  .log-list::-webkit-scrollbar{width:8px}
  .log-list::-webkit-scrollbar-thumb{background: var(--line); border-radius: 8px}

  .rec{
    display:flex; align-items:center; gap: 7px;
    padding: 7px 6px;
    border-radius: 9px;
    font-size: 13px;
  }
  .rec:hover{background: var(--bg)}
  .rec .idx{
    width: 26px; flex:0 0 26px; text-align:center;
    color: var(--ink-3); font-size: 11.5px;
    font-variant-numeric: tabular-nums;
  }
  .rec .date{
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    flex: 0 0 auto;
  }
  .rec .dow{color: var(--ink-3); font-size: 12px; flex: 0 0 auto}
  .rec .amt{
    margin-left: auto;
    margin-right: 2px;
    font-size: 12.5px; font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 1px 8px;
    border-radius: 999px;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .rec .gap{color: var(--ink-3); font-size: 11.5px; padding-right:2px; white-space:nowrap}
  .rec .ops{display:flex; gap:2px; opacity:.55; transition: opacity .15s}
  .rec .ops .mini-btn{color: var(--ink-2)}
  .rec:hover .ops, .rec .ops:focus-within{opacity:1}
  @media (hover: none){ .rec .ops{opacity:.9} }
  .empty{
    padding: 18px 8px 20px; text-align:center;
    font-size: 12.5px; color: var(--ink-3);
  }

  /* 空状态 */
  .empty-state{
    text-align:center; padding: 72px 20px;
    color: var(--ink-3);
  }
  .empty-state .big{font-size: 40px; margin-bottom: 12px; opacity:.7}
  .empty-state p{margin: 4px 0 18px; font-size: 14px}

  /* ---------- 弹窗 ---------- */
  dialog{
    border: none; padding: 0;
    border-radius: 18px;
    background: var(--card);
    color: var(--ink);
    width: min(440px, calc(100vw - 32px));
    box-shadow: 0 24px 64px -12px rgba(0,0,0,.4);
  }
  dialog::backdrop{background: rgba(20,19,22,.45); backdrop-filter: blur(3px)}
  .dlg-body{padding: 20px}
  .dlg-title{font-size: 17px; font-weight: 700; margin: 0 0 16px}
  .field{margin-bottom: 14px}
  .field label{display:block; font-size: 12.5px; font-weight:600; color: var(--ink-2); margin-bottom: 6px}
  .field .hint{font-weight: 400; color: var(--ink-3)}
  .field input[type="text"], .field input[type="number"], .field textarea{
    width: 100%; padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--bg);
    outline: none;
    transition: border-color .15s, background .15s;
  }
  .field input:focus, .field textarea:focus{border-color: var(--accent); background: var(--card)}
  .field textarea{resize: vertical; min-height: 60px}
  .row2{display:grid; grid-template-columns: 1fr 1fr; gap: 10px}
  .dlg-foot{display:flex; gap: 8px; justify-content: flex-end; margin-top: 20px}
  .dlg-foot .btn-danger{margin-right:auto}

  /* 数量输入行 */
  .amt-row{display:flex; align-items:center; gap:8px}
  .amt-row input{
    flex: 1 1 auto; min-width: 0;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--bg);
    font-size: 20px; font-weight: 700;
    font-variant-numeric: tabular-nums;
    outline: none;
  }
  .amt-row input:focus{border-color: var(--accent); background: var(--card)}
  .amt-unit{flex: 0 0 auto; font-size: 13.5px; font-weight: 600; color: var(--ink-2); min-width: 2em}
  .chips{display:flex; flex-wrap: wrap; gap: 6px; margin-top: 8px}
  .chip{
    padding: 4px 11px; border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--card);
    font-size: 12.5px; font-weight: 600;
    color: var(--ink-2);
    transition: background .15s, border-color .15s, color .15s;
  }
  .chip:hover{border-color: var(--accent); color: var(--accent); background: var(--accent-soft)}
  .rec-hint{font-size: 12px; color: var(--ink-3); margin: 2px 0 0; line-height: 1.5}

  /* 备份文本区 */
  .backup-area{
    width: 100%;
    height: 160px;
    resize: vertical;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink-2);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11.5px;
    line-height: 1.5;
    outline: none;
    -webkit-user-select: text;
    user-select: text;
  }
  .backup-area:focus{border-color: var(--accent)}
  a.btn{text-decoration:none}

  /* 年月日下拉框 */
  .date-picker{display:flex; gap: 8px}
  .date-picker select{
    flex: 1 1 0; min-width: 0;
    padding: 10px 8px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--bg);
    outline: none;
    font-size: 14px; font-weight: 600;
    font-variant-numeric: tabular-nums;
    appearance: none;
    -webkit-appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%),
                      linear-gradient(135deg, var(--ink-3) 50%, transparent 50%);
    background-position: calc(100% - 14px) 50%, calc(100% - 9px) 50%;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    padding-right: 24px;
  }
  .date-picker select:focus{border-color: var(--accent); background-color: var(--card)}
  .date-picker select:first-child{flex: 1.25 1 0}

  /* toast */
  #toasts{
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    display:flex; flex-direction: column; gap: 8px;
    z-index: 999; align-items:center; pointer-events:none;
  }
  .toast{
    background: var(--ink); color: var(--bg);
    padding: 9px 16px; border-radius: 999px;
    font-size: 13px; font-weight: 600;
    box-shadow: 0 8px 24px -8px rgba(0,0,0,.5);
    animation: pop .22s cubic-bezier(.2,1.2,.4,1);
  }
  @keyframes pop{ from{opacity:0; transform: translateY(8px) scale(.96)} to{opacity:1; transform:none} }

  @media (max-width: 720px){
    .top-in{gap:8px; padding: 10px 0}
    .brand{font-size: 15.5px}
    .brand small{display:none}
    .btn-sm{padding: 7px 11px; font-size: 12.5px}
  }
  @media (max-width: 480px){
    .counter .num{font-size: 34px}
    .grid{grid-template-columns: 1fr; gap: 12px}
    /* 小屏隐藏相对间隔，优先保证日期和操作按钮 */
    .rec .gap{display:none}
    .rec .idx{width:24px; flex-basis:24px}
    .rec .ops{opacity:1; gap:4px}
    .rec{padding: 8px 6px; gap:6px}
    #btnNew{padding: 7px 10px}
  }
</style>
</head>
<body>

<header class="top">
  <div class="wrap top-in">
    <div class="brand"><span class="dot"></span>恒迹 · 坚持打卡 <small id="globalStat"></small></div>
    <button class="btn btn-ghost btn-sm" id="btnExport" title="备份全部数据">导出备份</button>
    <button class="btn btn-ghost btn-sm" id="btnImport" title="从备份恢复数据">导入</button>
    <button class="btn btn-primary btn-sm" id="btnNew">＋ 新建项目</button>
    <input type="file" id="fileInput" accept="application/json,.json" hidden>
  </div>
</header>

<main class="wrap">
  <div class="grid" id="grid"></div>
  <div class="empty-state" id="emptyState" hidden>
    <div class="big">◷</div>
    <p>还没有项目。先写下你想坚持的事，比如「读书 · 页」或「冥想 · 分钟」。</p>
    <button class="btn btn-primary" onclick="document.getElementById('btnNew').click()">新建第一个项目</button>
  </div>
</main>

<!-- 新建 / 编辑项目 -->
<dialog id="dlgProject">
  <form method="dialog" class="dlg-body" id="formProject">
    <h2 class="dlg-title" id="dlgProjectTitle">新建项目</h2>
    <div class="field">
      <label for="pName">项目名称 <span class="hint">必填</span></label>
      <input type="text" id="pName" autocomplete="off" placeholder="例如：读书、俯卧撑、练字" required>
    </div>
    <div class="row2">
      <div class="field">
        <label for="pUnit">单位 <span class="hint">必填</span></label>
        <input type="text" id="pUnit" autocomplete="off" placeholder="页 / 次 / 回 / 分钟" required>
      </div>
      <div class="field">
        <label for="pTarget">目标值 <span class="hint">可留空</span></label>
        <input type="number" id="pTarget" min="0" step="any" placeholder="如 100">
      </div>
    </div>
    <div class="field">
      <label for="pNote">备注 <span class="hint">可留空</span></label>
      <textarea id="pNote" rows="2" placeholder="例如：每天睡前 20 页"></textarea>
    </div>
    <div class="dlg-foot">
      <button type="button" class="btn btn-danger" id="btnDeleteProject" hidden>删除项目</button>
      <button type="button" class="btn" data-close>取消</button>
      <button type="submit" class="btn btn-primary" id="btnSaveProject">保存</button>
    </div>
  </form>
</dialog>

<!-- 新增 / 修改一条记录 -->
<dialog id="dlgRecord">
  <form class="dlg-body" id="formRecord" novalidate>
    <h2 class="dlg-title" id="dlgRecTitle">自定数量</h2>

    <div class="field">
      <label for="rAmount" id="rAmtLabel">数量</label>
      <div class="amt-row">
        <input type="number" id="rAmount" min="0" step="any" inputmode="decimal" placeholder="例如 20">
        <span class="amt-unit" id="rAmtUnit">次</span>
      </div>
      <div class="chips" id="rQuick"></div>
    </div>

    <div class="field">
      <label>日期</label>
      <div class="date-picker">
        <select id="rYear" aria-label="年"></select>
        <select id="rMonth" aria-label="月"></select>
        <select id="rDay" aria-label="日"></select>
      </div>
      <div class="chips" id="rDateQuick">
        <button type="button" class="chip" data-off="0">今天</button>
        <button type="button" class="chip" data-off="-1">昨天</button>
        <button type="button" class="chip" data-off="-2">前天</button>
      </div>
    </div>

    <p class="rec-hint" id="rHint"></p>

    <div class="dlg-foot">
      <button type="button" class="btn" data-close-rec>取消</button>
      <button type="submit" class="btn btn-primary">保存</button>
    </div>
  </form>
</dialog>

<!-- 导出备份 -->
<dialog id="dlgBackup">
  <div class="dlg-body">
    <h2 class="dlg-title">导出备份</h2>
    <p class="rec-hint" style="margin:0 0 10px">
      手机上下载可能存不下来。最稳的方式是点下面的<strong>复制全部内容</strong>，粘贴到备忘录或微信「文件传输助手」保存。
    </p>
    <textarea id="backupText" class="backup-area" readonly spellcheck="false"></textarea>
    <div class="dlg-foot" style="flex-wrap: wrap; gap: 8px">
      <button type="button" class="btn" data-close-backup>关闭</button>
      <a class="btn" id="btnDownload">下载文件</a>
      <button type="button" class="btn btn-primary" id="btnCopyBackup">复制全部内容</button>
    </div>
  </div>
</dialog>

<!-- 导入备份 -->
<dialog id="dlgImport">
  <div class="dlg-body">
    <h2 class="dlg-title">导入备份</h2>
    <p class="rec-hint" style="margin:0 0 10px">
      二选一：选一个备份文件，或把之前复制的备份内容粘贴到下面。
    </p>
    <div class="field" style="margin-bottom:10px">
      <button type="button" class="btn" id="btnPickFile" style="width:100%">选择一个 .json 备份文件</button>
    </div>
    <div class="field">
      <label for="importText">或直接粘贴备份内容</label>
      <textarea id="importText" class="backup-area" placeholder="在这里粘贴备份的 JSON 内容…" spellcheck="false"></textarea>
    </div>
    <div class="dlg-foot">
      <button type="button" class="btn" data-close-import>取消</button>
      <button type="button" class="btn btn-primary" id="btnImportPaste">导入</button>
    </div>
  </div>
</dialog>

<div id="toasts"></div>

<script>
(function(){
  "use strict";

  /* ============ 存储层 ============ */
  const STORE_KEY = "persist-checkin-v1";

  function uid(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  /** 规范化：保证结构合法，容忍脏数据与旧版数据 */
  function normalize(raw){
    if (!raw || typeof raw !== "object" || !Array.isArray(raw.projects)) return null;
    const projects = raw.projects.map(p => {
      const recs = Array.isArray(p.records) ? p.records : [];
      return {
        id: p.id || uid(),
        name: String(p.name ?? "").trim() || "未命名项目",
        unit: String(p.unit ?? "").trim() || "次",
        note: typeof p.note === "string" ? p.note : "",
        target: Number(p.target) > 0 ? Number(p.target) : null,
        createdAt: p.createdAt || new Date().toISOString(),
        records: recs
          .filter(r => r && /^\d{4}-\d{2}-\d{2}$/.test(r.date || ""))
          .map(r => ({
            id: r.id || uid(),
            date: r.date,
            at: r.at || r.date,
            // 旧数据没有 amount，按 1 补齐
            amount: Number.isFinite(Number(r.amount)) && Number(r.amount) > 0 ? Number(r.amount) : 1
          }))
          .sort((a, b) => b.date.localeCompare(a.date) || String(b.at).localeCompare(String(a.at)))
      };
    });
    return { version: 2, projects };
  }

  /** 项目总量：所有记录的 amount 之和 */
  function totalOf(p){
    return p.records.reduce((s, r) => s + (Number(r.amount) || 0), 0);
  }

  function fmtNum(n){
    return String(Math.round(n * 100) / 100);
  }

  let state = load();

  function load(){
    try {
      const txt = localStorage.getItem(STORE_KEY);
      if (!txt) return { version: 2, projects: [] };
      return normalize(JSON.parse(txt)) || { version: 2, projects: [] };
    } catch (e) {
      console.warn("读取本地数据失败", e);
      return { version: 2, projects: [] };
    }
  }

  function save(){
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
    } catch (e) {
      toast("保存失败：浏览器存储空间不足或被禁用");
      console.error(e);
    }
  }

  /* ============ 工具 ============ */
  const pad2 = n => String(n).padStart(2, "0");

  /** 本地时区的 YYYY-MM-DD（不能用 toISOString，会差时区） */
  function todayStr(d){
    d = d || new Date();
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  }

  function fmtDate(s){
    const [y, m, d] = s.split("-");
    return y + "年" + Number(m) + "月" + Number(d) + "日";
  }

  const DOW = ["周日","周一","周二","周三","周四","周五","周六"];
  function dowOf(s){
    const [y, m, d] = s.split("-").map(Number);
    return DOW[new Date(y, m - 1, d).getDay()];
  }

  function daysBetween(a, b){ // b - a，单位天
    const [y1,m1,d1] = a.split("-").map(Number);
    const [y2,m2,d2] = b.split("-").map(Number);
    return Math.round((new Date(y2, m2-1, d2) - new Date(y1, m1-1, d1)) / 86400000);
  }

  function esc(s){
    return String(s).replace(/[&<>"']/g, c => ({
      "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
    }[c]));
  }

  function toast(msg){
    const box = document.getElementById("toasts");
    while (box.children.length >= 2) box.firstElementChild.remove();
    const el = document.createElement("div");
    el.className = "toast";
    el.textContent = msg;
    box.appendChild(el);
    setTimeout(() => {
      el.style.transition = "opacity .25s";
      el.style.opacity = "0";
      setTimeout(() => el.remove(), 260);
    }, 1600);
  }

  const findProject = id => state.projects.find(p => p.id === id);

  /* ============ 渲染 ============ */
  const grid = document.getElementById("grid");
  const emptyState = document.getElementById("emptyState");
  const globalStat = document.getElementById("globalStat");

  function render(){
    grid.innerHTML = "";
    if (state.projects.length === 0){
      emptyState.hidden = false;
      globalStat.textContent = "";
    } else {
      emptyState.hidden = true;
      const totalRecs = state.projects.reduce((s, p) => s + p.records.length, 0);
      globalStat.textContent = state.projects.length + " 个项目 · " + totalRecs + " 条记录";
      state.projects.forEach(p => grid.appendChild(cardFor(p)));
    }
    save();
  }

  function cardFor(p){
    const total = totalOf(p);
    const dates = new Set(p.records.map(r => r.date));
    const today = todayStr();
    const todayQty = p.records.filter(r => r.date === today)
                              .reduce((s, r) => s + (Number(r.amount) || 0), 0);
    const multiPerDay = p.records.length > dates.size;

    const el = document.createElement("section");
    el.className = "card";
    el.dataset.pid = p.id;

    // ---- 头部 ----
    const head = document.createElement("div");
    head.className = "card-head";

    const titleRow = document.createElement("div");
    titleRow.className = "card-title-row";
    titleRow.innerHTML =
      '<div class="card-title">' + esc(p.name) + '</div>' +
      '<button class="mini-btn" data-act="edit" title="编辑项目">编辑</button>' +
      '<button class="mini-btn del" data-act="del" title="删除项目">删除</button>';
    head.appendChild(titleRow);

    if (p.note){
      const note = document.createElement("p");
      note.className = "note";
      note.textContent = p.note;
      head.appendChild(note);
    }

    const counter = document.createElement("div");
    counter.className = "counter";
    counter.innerHTML =
      '<div class="num">' + fmtNum(total) + '</div>' +
      '<div class="unit">' + esc(p.unit) + '</div>' +
      '<div class="sub">' + (dates.size ? dates.size + " 个" + (p.unit === "天" ? "打卡日" : "天有记录") : "还没有记录") +
      (todayQty ? "<br>今日 " + fmtNum(todayQty) + " " + esc(p.unit) : "") + '</div>';
    head.appendChild(counter);

    if (p.target){
      const pct = Math.min(100, Math.round(total / p.target * 100));
      const prog = document.createElement("div");
      prog.className = "progress";
      prog.innerHTML =
        '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
        '<div class="progress-meta"><span>目标 ' + p.target + ' ' + esc(p.unit) + '</span><span>' + pct + '%</span></div>';
      head.appendChild(prog);
    }

    el.appendChild(head);

    // ---- 打卡按钮组 ----
    const punchBar = document.createElement("div");
    punchBar.className = "punch-bar";

    const punch = document.createElement("button");
    punch.className = "punch";
    punch.dataset.act = "punch";
    punch.innerHTML = '<span class="plus">＋</span> 记 1 ' + esc(p.unit);

    const custom = document.createElement("button");
    custom.className = "punch-custom";
    custom.dataset.act = "custom";
    custom.title = "自己填数量，也可以补录过去的日期";
    custom.textContent = "自定数量";

    punchBar.appendChild(punch);
    punchBar.appendChild(custom);
    el.appendChild(punchBar);

    // ---- 记录列表 ----
    const log = document.createElement("div");
    log.className = "log";

    const logHead = document.createElement("div");
    logHead.className = "log-head";
    logHead.innerHTML = '<span>打卡记录</span><span class="spacer"></span>' +
      (p.records.length > 0 ? '<span>最新在前 · 可改日期与数量</span>' : '');
    log.appendChild(logHead);

    const list = document.createElement("div");
    list.className = "log-list";

    if (p.records.length === 0){
      const e = document.createElement("div");
      e.className = "empty";
      e.textContent = "点上面的按钮记录第一次";
      list.appendChild(e);
    } else {
      // 日期降序，同日按创建时间降序
      const sorted = p.records.slice().sort(
        (a, b) => b.date.localeCompare(a.date) || String(b.at).localeCompare(String(a.at))
      );
      // 固定序号：按创建时间升序，改日期后编号不变
      const seqMap = new Map();
      p.records
        .slice()
        .sort((a, b) => String(a.at).localeCompare(String(b.at)) || a.id.localeCompare(b.id))
        .forEach((r, i) => seqMap.set(r.id, i + 1));

      sorted.forEach((r, i) => {
        const row = document.createElement("div");
        row.className = "rec";
        row.dataset.rid = r.id;

        // 同日多条时标注「当天第 N 条」，否则显示与上一条的日期间隔
        let gapTxt = "";
        if (multiPerDay){
          const sameDay = p.records
            .filter(x => x.date === r.date)
            .sort((a, b) => String(a.at).localeCompare(String(b.at)) || a.id.localeCompare(b.id));
          if (sameDay.length > 1){
            const nth = sameDay.findIndex(x => x.id === r.id) + 1;
            gapTxt = "当天第 " + nth + " 条";
          }
        }
        if (!gapTxt){
          const next = sorted[i + 1];
          if (next){
            const g = daysBetween(next.date, r.date);
            if (g === 0) gapTxt = "同日";
            else if (g === 1) gapTxt = "连续";
            else gapTxt = "隔 " + g + " 天";
          }
        }

        row.innerHTML =
          '<span class="idx">#' + (seqMap.get(r.id) || (p.records.length - i)) + '</span>' +
          '<span class="date" data-role="date">' + fmtDate(r.date) + '</span>' +
          '<span class="dow">' + dowOf(r.date) + '</span>' +
          '<span class="amt">' + fmtNum(r.amount) + ' ' + esc(p.unit) + '</span>' +
          '<span class="gap">' + gapTxt + '</span>' +
          '<span class="ops">' +
            '<button class="mini-btn" data-act="editRec" title="修改这一条（数量和日期）">改</button>' +
            '<button class="mini-btn del" data-act="delRec" title="删除这条记录">删</button>' +
          '</span>';
        list.appendChild(row);
      });
    }

    log.appendChild(list);
    el.appendChild(log);

    return el;
  }

  /* ============ 事件：卡片内委托 ============ */
  grid.addEventListener("click", e => {
    const btn = e.target.closest("[data-act]");
    if (!btn) return;
    const card = e.target.closest(".card");
    if (!card) return;
    const p = findProject(card.dataset.pid);
    if (!p) return;

    const act = btn.dataset.act;

    if (act === "punch"){
      punch(p);
    } else if (act === "custom"){
      openRecordDialog(p, null);
    } else if (act === "edit"){
      openProjectDialog(p);
    } else if (act === "del"){
      confirmDeleteProject(p);
    } else if (act === "delRec"){
      const row = btn.closest(".rec");
      deleteRecord(p, row && row.dataset.rid);
    } else if (act === "editRec"){
      const row = btn.closest(".rec");
      const rec = p.records.find(r => r.id === (row && row.dataset.rid));
      if (rec) openRecordDialog(p, rec);
    }
  });

  function punch(p){
    const now = new Date();
    p.records.push({ id: uid(), date: todayStr(now), at: now.toISOString(), amount: 1 });
    render();
    toast("已记录 +1 " + p.unit + "（共 " + fmtNum(totalOf(p)) + "）");
  }

  function deleteRecord(p, rid){
    const rec = p.records.find(r => r.id === rid);
    if (!rec) return;
    const ok = confirm("删除这条记录？\n\n" + p.name + " · " + fmtDate(rec.date) + "\n\n删除后该项目总数会减 1。");
    if (!ok) return;
    p.records = p.records.filter(r => r.id !== rid);
    render();
    toast("已删除 1 条记录");
  }

  /* ============ 记录弹窗（自定数量 / 修改记录） ============ */
  const dlgRecord   = document.getElementById("dlgRecord");
  const formRecord  = document.getElementById("formRecord");
  const dlgRecTitle = document.getElementById("dlgRecTitle");
  const rAmount     = document.getElementById("rAmount");
  const rYear       = document.getElementById("rYear");
  const rMonth      = document.getElementById("rMonth");
  const rDay        = document.getElementById("rDay");
  const rDateQuick  = document.getElementById("rDateQuick");
  const rAmtLabel   = document.getElementById("rAmtLabel");
  const rAmtUnit    = document.getElementById("rAmtUnit");
  const rHint       = document.getElementById("rHint");
  const rQuick      = document.getElementById("rQuick");

  let recCtx = { pid: null, rid: null };

  fillYearSelect();
  fillMonthSelect();

  function fillYearSelect(){
    const cur = new Date().getFullYear();
    rYear.innerHTML = "";
    for (let y = cur + 1; y >= cur - 11; y--){
      const o = document.createElement("option");
      o.value = String(y);
      o.textContent = y + "年";
      rYear.appendChild(o);
    }
  }

  function fillMonthSelect(){
    rMonth.innerHTML = "";
    for (let m = 1; m <= 12; m++){
      const o = document.createElement("option");
      o.value = String(m);
      o.textContent = m + "月";
      rMonth.appendChild(o);
    }
  }

  /** 按年月重算天数，保留当前选中日（超出范围则收敛到月末） */
  function fillDaySelect(preferDay){
    const y = Number(rYear.value);
    const m = Number(rMonth.value);
    const dim = new Date(y, m, 0).getDate();
    const keep = Math.min(preferDay || Number(rDay.value) || 1, dim);

    rDay.innerHTML = "";
    for (let d = 1; d <= dim; d++){
      const o = document.createElement("option");
      o.value = String(d);
      o.textContent = d + "日";
      rDay.appendChild(o);
    }
    rDay.value = String(keep);
  }

  function setDateSelects(dateStr){
    const [y, m, d] = dateStr.split("-").map(Number);
    if (rYear.options.length === 0) fillYearSelect();
    if (rMonth.options.length === 0) fillMonthSelect();
    if (!Array.from(rYear.options).some(o => Number(o.value) === y)){
      const o = document.createElement("option");
      o.value = String(y); o.textContent = y + "年";
      rYear.appendChild(o);
    }
    rYear.value = String(y);
    rMonth.value = String(m);
    fillDaySelect(d);
  }

  function getDateFromSelects(){
    const y = Number(rYear.value);
    const m = Number(rMonth.value);
    const d = Number(rDay.value);
    if (!y || !m || !d) return null;
    const dim = new Date(y, m, 0).getDate();
    if (d > dim) return null;
    return y + "-" + pad2(m) + "-" + pad2(d);
  }

  rYear.addEventListener("change", () => fillDaySelect());
  rMonth.addEventListener("change", () => fillDaySelect());

  rDateQuick.addEventListener("click", e => {
    const btn = e.target.closest("[data-off]");
    if (!btn) return;
    const d = new Date();
    d.setDate(d.getDate() + Number(btn.dataset.off));
    setDateSelects(todayStr(d));
  });

  function openRecordDialog(p, rec){
    recCtx = { pid: p.id, rid: rec ? rec.id : null };
    const isEdit = !!rec;

    dlgRecTitle.textContent = (isEdit ? "修改记录" : "自定数量") + " · " + p.name;
    rAmtLabel.textContent = isEdit ? "数量" : "这次完成多少";
    rAmtUnit.textContent = p.unit;
    rAmount.value = isEdit ? rec.amount : 1;
    setDateSelects(isEdit ? rec.date : todayStr());
    rHint.textContent = isEdit
      ? "改完点保存。数量改小或改大都只影响这一条记录。"
      : "适合「冥想 20 分钟」这类一次做很多单位的情况，不用点 20 次。";

    // 快捷数量：点一下直接设为该值
    rQuick.innerHTML = "";
    [5, 10, 15, 20, 30, 60].forEach(v => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      b.textContent = String(v);
      b.addEventListener("click", () => {
        rAmount.value = v;
        rAmount.focus();
      });
      rQuick.appendChild(b);
    });

    dlgRecord.showModal();
    setTimeout(() => { rAmount.focus(); rAmount.select(); }, 30);
  }

  formRecord.addEventListener("submit", e => {
    e.preventDefault();
    const p = findProject(recCtx.pid);
    if (!p) return;

    const amount = Number(rAmount.value);
    if (!Number.isFinite(amount) || amount <= 0){
      toast("数量要大于 0");
      rAmount.focus();
      return;
    }
    const date = getDateFromSelects();
    if (!date){
      toast("请选择有效日期");
      return;
    }

    if (recCtx.rid){
      const rec = p.records.find(r => r.id === recCtx.rid);
      if (rec){
        rec.amount = amount;
        rec.date = date;
        toast("已修改为 " + fmtNum(amount) + " " + p.unit + " · " + fmtDate(date));
      }
    } else {
      p.records.push({ id: uid(), date, at: new Date().toISOString(), amount });
      toast("已记录 +" + fmtNum(amount) + " " + p.unit + "（共 " + fmtNum(totalOf(p)) + "）");
    }
    dlgRecord.close();
    render();
  });

  /* ============ 项目弹窗 ============ */
  const dlgProject      = document.getElementById("dlgProject");
  const formProject     = document.getElementById("formProject");
  const dlgProjectTitle = document.getElementById("dlgProjectTitle");
  const pName   = document.getElementById("pName");
  const pUnit   = document.getElementById("pUnit");
  const pTarget = document.getElementById("pTarget");
  const pNote   = document.getElementById("pNote");
  const btnDeleteProject = document.getElementById("btnDeleteProject");

  let editingId = null;

  function openProjectDialog(p){
    editingId = p ? p.id : null;
    dlgProjectTitle.textContent = p ? "编辑项目" : "新建项目";
    pName.value   = p ? p.name : "";
    pUnit.value   = p ? p.unit : "";
    pTarget.value = p && p.target ? p.target : "";
    pNote.value   = p ? p.note : "";
    btnDeleteProject.hidden = !p;
    dlgProject.showModal();
    setTimeout(() => pName.focus(), 30);
  }

  formProject.addEventListener("submit", e => {
    e.preventDefault();
    const name = pName.value.trim();
    const unit = pUnit.value.trim();
    if (!name || !unit) return;
    const target = Number(pTarget.value) > 0 ? Number(pTarget.value) : null;
    const note = pNote.value.trim();

    if (editingId){
      const p = findProject(editingId);
      if (p){
        p.name = name; p.unit = unit; p.target = target; p.note = note;
        toast("项目已更新");
      }
    } else {
      state.projects.push({
        id: uid(), name, unit, note, target,
        createdAt: new Date().toISOString(), records: []
      });
      toast("已新建项目「" + name + "」");
    }
    dlgProject.close();
    render();
  });

  btnDeleteProject.addEventListener("click", () => {
    const p = findProject(editingId);
    if (!p) return;
    if (confirmDeleteProject(p)){ dlgProject.close(); }
  });

  function confirmDeleteProject(p){
    const n = p.records.length;
    const msg = "删除项目「" + p.name + "」？\n\n" +
      (n ? "它的 " + n + " 条打卡记录会一并删除，且无法恢复。" : "该项目还没有记录。") +
      "\n\n确定删除请点击「确定」。";
    if (!confirm(msg)) return false;
    state.projects = state.projects.filter(x => x.id !== p.id);
    render();
    toast("已删除项目「" + p.name + "」");
    return true;
  }

  /* ============ 顶部按钮与弹窗关闭 ============ */
  document.getElementById("btnNew").addEventListener("click", () => openProjectDialog(null));

  document.querySelectorAll("[data-close]").forEach(b =>
    b.addEventListener("click", () => dlgProject.close())
  );
  document.querySelectorAll("[data-close-rec]").forEach(b =>
    b.addEventListener("click", () => dlgRecord.close())
  );
  document.querySelectorAll("[data-close-backup]").forEach(b =>
    b.addEventListener("click", () => document.getElementById("dlgBackup").close())
  );
  document.querySelectorAll("[data-close-import]").forEach(b =>
    b.addEventListener("click", () => document.getElementById("dlgImport").close())
  );

  dlgProject.addEventListener("click", e => {
    if (e.target === dlgProject) dlgProject.close();
  });
  dlgRecord.addEventListener("click", e => {
    if (e.target === dlgRecord) dlgRecord.close();
  });
  ["dlgBackup", "dlgImport"].forEach(id => {
    const d = document.getElementById(id);
    d.addEventListener("click", e => { if (e.target === d) d.close(); });
  });

  /* ============ 导出：复制 + 下载双通道 ============ */
  const dlgBackup      = document.getElementById("dlgBackup");
  const backupText     = document.getElementById("backupText");
  const btnCopyBackup  = document.getElementById("btnCopyBackup");
  const btnDownload    = document.getElementById("btnDownload");
  const btnImportPaste = document.getElementById("btnImportPaste");

  let backupBlobUrl = null;

  function buildBackupText(){
    return JSON.stringify({
      version: 2,
      exportedAt: new Date().toISOString(),
      app: "恒迹",
      projects: state.projects
    }, null, 2);
  }

  document.getElementById("btnExport").addEventListener("click", () => {
    if (state.projects.length === 0){ toast("还没有数据可以导出"); return; }

    const data = buildBackupText();
    backupText.value = data;

    if (backupBlobUrl) URL.revokeObjectURL(backupBlobUrl);
    const blob = new Blob([data], { type: "application/json" });
    backupBlobUrl = URL.createObjectURL(blob);
    btnDownload.href = backupBlobUrl;
    btnDownload.download = "恒迹备份-" + todayStr() + ".json";

    dlgBackup.showModal();
  });

  btnCopyBackup.addEventListener("click", async () => {
    const text = backupText.value;
    let ok = false;

    try {
      if (navigator.clipboard && window.isSecureContext){
        await navigator.clipboard.writeText(text);
        ok = true;
      }
    } catch(_){}

    if (!ok){
      try {
        backupText.focus();
        backupText.select();
        backupText.setSelectionRange(0, text.length);
        ok = document.execCommand("copy");
      } catch(_){}
    }

    if (ok){
      btnCopyBackup.textContent = "已复制 ✓";
      toast("已复制，粘贴到备忘录或聊天窗口保存");
      setTimeout(() => { btnCopyBackup.textContent = "复制全部内容"; }, 2200);
    } else {
      backupText.focus();
      backupText.select();
      toast("请长按文字手动全选复制");
    }
  });

  backupText.addEventListener("click", () => backupText.select());

  /* ============ 导入：选文件或粘贴 ============ */
  const dlgImport   = document.getElementById("dlgImport");
  const importText  = document.getElementById("importText");
  const btnPickFile = document.getElementById("btnPickFile");
  const fileInput   = document.getElementById("fileInput");

  document.getElementById("btnImport").addEventListener("click", () => {
    importText.value = "";
    dlgImport.showModal();
  });

  btnPickFile.addEventListener("click", () => fileInput.click());

  fileInput.addEventListener("change", () => {
    const f = fileInput.files && fileInput.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      importText.value = String(reader.result || "");
      fileInput.value = "";
      toast("文件已读入，确认后点「导入」");
    };
    reader.readAsText(f);
  });

  btnImportPaste.addEventListener("click", () => doImport(importText.value));

  function doImport(rawText){
    const txt = String(rawText || "").trim();
    if (!txt){ toast("请先粘贴备份内容或选择文件"); return; }

    let parsed = null;
    try { parsed = JSON.parse(txt); } catch(_){}

    // 兼容只粘贴 projects 数组的情况
    if (Array.isArray(parsed)) parsed = { projects: parsed };
    if (parsed && !parsed.projects && Array.isArray(parsed.data && parsed.data.projects)){
      parsed = parsed.data;
    }

    const norm = normalize(parsed);
    if (!norm){
      toast("内容不是有效的备份数据，已取消");
      return;
    }

    const existing = state.projects.length;
    const msg = "备份中有 " + norm.projects.length + " 个项目、" +
                norm.projects.reduce((s, p) => s + p.records.length, 0) + " 条记录。\n\n" +
                (existing ? "当前已有 " + existing + " 个项目。\n" : "") +
                "点「确定」= 合并进来（不会删掉现有数据）\n" +
                "点「取消」= 放弃本次导入";
    if (!confirm(msg)) return;

    const existIds = new Set(state.projects.map(p => p.id));
    norm.projects.forEach(p => {
      while (existIds.has(p.id)) p.id = uid();
      existIds.add(p.id);
      const ridSet = new Set();
      p.records.forEach(r => {
        while (ridSet.has(r.id)) r.id = uid();
        ridSet.add(r.id);
      });
      state.projects.push(p);
    });

    dlgImport.close();
    render();
    toast("已导入 " + norm.projects.length + " 个项目");
  }

  /* ============ 其他 ============ */
  // 跨标签页同步
  window.addEventListener("storage", e => {
    if (e.key === STORE_KEY){ state = load(); render(); }
  });

  // 午夜自动刷新「今日」统计
  let lastDay = todayStr();
  setInterval(() => {
    const d = todayStr();
    if (d !== lastDay){ lastDay = d; render(); }
  }, 60 * 1000);

  document.addEventListener("dragstart", e => {
    if (e.target.tagName !== "INPUT") e.preventDefault();
  });

  render();
})();
</script>
</body>
</html>
